<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 300px;
      padding: 20px;
      font-family: Arial, sans-serif;
    }
    
    .container {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    
    label {
      font-weight: bold;
      font-size: 12px;
      color: #333;
    }
    
    input {
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
    }
    
    input:focus {
      outline: none;
      border-color: #4CAF50;
    }
    
    .status {
      padding: 10px;
      border-radius: 4px;
      text-align: center;
      font-weight: bold;
      margin: 10px 0;
    }
    
    .status-enabled {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    
    .status-disabled {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    
    .connect-btn {
      background-color: #4CAF50;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      width: 100%;
    }
    
    .connect-btn:hover {
      background-color: #45a049;
    }
    
    .connect-btn.disconnect {
      background-color: #dc3545;
    }
    
    .connect-btn.disconnect:hover {
      background-color: #c82333;
    }
    
    h3 {
      margin: 0 0 10px 0;
      text-align: center;
      color: #333;
    }
    
    .footer {
      text-align: center;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #eee;
    }
    
    .developer {
      font-size: 12px;
      color: #666;
      margin-bottom: 5px;
    }
    
    .github-link {
      font-size: 11px;
      color: #0366d6;
      text-decoration: none;
    }
    
    .github-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h3>Burp Suite Connect</h3>
    
    <div class="input-group">
      <label for="host">Host:</label>
      <input type="text" id="host" placeholder="127.0.0.1">
    </div>
    
    <div class="input-group">
      <label for="port">Port:</label>
      <input type="number" id="port" placeholder="8080" min="1" max="65535">
    </div>
    
    <div id="status" class="status status-disabled">Disconnected</div>
    
    <button id="connectBtn" class="connect-btn">Connect</button>
    
    <div class="footer">
      <div class="developer">Developer: <a href="https://github.com/AK-ALiEN" target="_blank" class="github-link">ALiEN</a></div>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
